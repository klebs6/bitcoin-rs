[package]
name = "bitcoinleveldb-harness"
version = "0.1.0"
license = "MIT AND BSD-3-Clause"
edition = "2024"
description = "Shared comparison harness for LevelDB blocks, tables, and databases."

# keywords = []
# categories = []

repository = "https://github.com/klebs6/bitcoin-rs"
[dependencies]
bitcoin-imports = { path = "../bitcoin-imports", version = "0.1.19" }
bitcoinleveldb-options = { path = "../bitcoinleveldb-options", version = "0.1.19" }
bitcoinleveldb-tableconstructor = { path = "../bitcoinleveldb-tableconstructor", version = "0.1.0" }
bitcoinleveldb-rand = { path = "../bitcoinleveldb-rand", version = "0.1.19" }
bitcoinleveldb-dbinterface = { path = "../bitcoinleveldb-dbinterface", version = "0.1.0" }
bitcoinleveldb-iterator = { path = "../bitcoinleveldb-iterator", version = "0.1.0" }
bitcoinleveldb-blockconstructor = { path = "../bitcoinleveldb-blockconstructor", version = "0.1.0" }
bitcoinleveldbt-dbtest = { path = "../bitcoinleveldbt-dbtest", version = "0.1.0" }
bitcoinleveldb-memtable = { path = "../bitcoinleveldb-memtable", version = "0.1.19" }
bitcoinleveldb-dbconstructor = { path = "../bitcoinleveldb-dbconstructor", version = "0.1.0" }
bitcoinleveldb-comparator = { path = "../bitcoinleveldb-comparator", version = "0.1.19" }
bitcoinleveldb-slice = { path = "../bitcoinleveldb-slice", version = "0.1.19" }
bitcoinleveldb-iteratorinner = { path = "../bitcoinleveldb-iteratorinner", version = "0.1.0" }
bitcoinleveldb-status = { path = "../bitcoinleveldb-status", version = "0.1.19" }
tracing.workspace = true
traced-test.workspace = true
tracing-subscriber.workspace = true
tracing-setup.workspace = true
bitcoinleveldb-dbimplinner = { path = "../bitcoinleveldb-dbimplinner", version = "0.1.0" }
bitcoinleveldb-blockcontents = { path = "../bitcoinleveldb-blockcontents", version = "0.1.0" }
bitcoinleveldb-block = { path = "../bitcoinleveldb-block", version = "0.1.0" }
