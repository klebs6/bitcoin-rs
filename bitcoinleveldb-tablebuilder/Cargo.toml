[package]
name = "bitcoinleveldb-tablebuilder"
version = "0.1.0"
license = "MIT"
edition = "2024"
description = "Writes immutable sorted LevelDB SSTable files. TableBuilder assembles data, index, filter, metaindex, and footer blocks, with checksums and the configured compression policy."

# keywords = []
# categories = []

repository = "https://github.com/klebs6/bitcoin-rs"
[dependencies]
tracing.workspace = true
bitcoinleveldb-slice = { path = "../bitcoinleveldb-slice", version = "0.1.19" }
bitcoinleveldb-blockhandle = { path = "../bitcoinleveldb-blockhandle", version = "0.1.0" }
bitcoinleveldb-status = { path = "../bitcoinleveldb-status", version = "0.1.19" }
bitcoinleveldb-filter = { path = "../bitcoinleveldb-filter", version = "0.1.19" }
bitcoinleveldb-blockbuilder = { path = "../bitcoinleveldb-blockbuilder", version = "0.1.0" }
bitcoinleveldb-options = { path = "../bitcoinleveldb-options", version = "0.1.19" }
bitcoin-crc32c = { path = "../bitcoin-crc32c", version = "0.1.19" }
bitcoinleveldb-compat = { path = "../bitcoinleveldb-compat", version = "0.1.19" }
bitcoinleveldb-coding = { path = "../bitcoinleveldb-coding", version = "0.1.19" }
bitcoinleveldb-footer = { path = "../bitcoinleveldb-footer", version = "0.1.0" }
bitcoinleveldb-file = { path = "../bitcoinleveldb-file", version = "0.1.19" }
bitcoinleveldb-comparator = { path = "../bitcoinleveldb-comparator", version = "0.1.19" }

[build-dependencies.bitcoin-cfg]
path = "../bitcoin-cfg"
version = "0.1.19"

[dependencies.bitcoin-derive]
path = "../bitcoin-derive"
version = "0.1.19"

[dependencies.bitcoin-imports]
path = "../bitcoin-imports"
version = "0.1.19"


