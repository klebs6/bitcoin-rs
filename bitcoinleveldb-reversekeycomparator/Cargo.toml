[package]
name = "bitcoinleveldb-reversekeycomparator"
version = "0.1.0"
license = "MIT"
edition = "2024"
description = "A comparator used to exercise non-default key ordering in LevelDB tests."

# keywords = []
# categories = []

repository = "https://github.com/klebs6/bitcoin-rs"
[dependencies]
tracing.workspace = true
bitcoinleveldb-slice = { path = "../bitcoinleveldb-slice", version = "0.1.19" }
bitcoinleveldb-comparator = { path = "../bitcoinleveldb-comparator", version = "0.1.19" }

[build-dependencies.bitcoin-cfg]
path = "../bitcoin-cfg"
version = "0.1.19"

[dependencies.bitcoin-derive]
path = "../bitcoin-derive"
version = "0.1.19"

[dependencies.bitcoin-imports]
path = "../bitcoin-imports"
version = "0.1.19"


