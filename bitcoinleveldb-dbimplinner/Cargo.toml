[package]
name = "bitcoinleveldb-dbimplinner"
version = "0.1.0"
license = "MIT"
edition = "2024"
description = "Internal background-compaction and coordination helpers for the bitcoin-rs LevelDB database implementation. This crate separates scheduling predicates, background-error recording, waiter notification, manual-compaction boundaries, and compaction-state preparation from the main database implementation."

# keywords = []
# categories = []

repository = "https://github.com/klebs6/bitcoin-rs"
[dependencies]
tracing.workspace              = true
disable_macro.workspace        = true
bitcoin-imports                = { path = "../bitcoin-imports", version = "0.1.19" }
bitcoin-derive                 = { path = "../bitcoin-derive", version = "0.1.19" }
bitcoinleveldb-status          = { path = "../bitcoinleveldb-status", version = "0.1.19" }
bitcoinleveldb-slice           = { path = "../bitcoinleveldb-slice", version = "0.1.19" }
bitcoinleveldb-options         = { path = "../bitcoinleveldb-options", version = "0.1.19" }
bitcoinleveldb-compaction      = { path = "../bitcoinleveldb-compaction", version = "0.1.0" }
bitcoinleveldb-iterator        = { path = "../bitcoinleveldb-iterator", version = "0.1.0" }
bitcoinleveldb-key             = { path = "../bitcoinleveldb-key", version = "0.1.19" }
bitcoinleveldb-snapshot        = { path = "../bitcoinleveldb-snapshot", version = "0.1.0" }
bitcoinleveldb-cache           = { path = "../bitcoinleveldb-cache", version = "0.1.19" }
bitcoinleveldb-file            = { path = "../bitcoinleveldb-file", version = "0.1.19" }
bitcoinleveldb-compactionstats = { path = "../bitcoinleveldb-compactionstats", version = "0.1.0" }
bitcoinleveldb-writebatch      = { path = "../bitcoinleveldb-writebatch", version = "0.1.0" }
bitcoinleveldb-dbimplwriter    = { path = "../bitcoinleveldb-dbimplwriter", version = "0.1.0" }
bitcoinleveldb-env             = { path = "../bitcoinleveldb-env", version = "0.1.19" }
bitcoinleveldb-tablecache      = { path = "../bitcoinleveldb-tablecache", version = "0.1.0" }
bitcoinleveldb-memtable        = { path = "../bitcoinleveldb-memtable", version = "0.1.19" }
bitcoinleveldb-logwriter       = { path = "../bitcoinleveldb-logwriter", version = "0.1.1" }
bitcoinleveldb-dbinterface     = { path = "../bitcoinleveldb-dbinterface", version = "0.1.0" }
bitcoinleveldb-version         = { path = "../bitcoinleveldb-version", version = "0.1.19" }
bitcoinleveldb-versionedit     = { path = "../bitcoinleveldb-versionedit", version = "0.1.19" }
bitcoinleveldb-batch           = { path = "../bitcoinleveldb-batch", version = "0.1.19" }
bitcoinleveldb-comparator      = { path = "../bitcoinleveldb-comparator", version = "0.1.19" }
bitcoinleveldb-versionset = { path = "../bitcoinleveldb-versionset", version = "0.1.0" }
bitcoinleveldb-log = { path = "../bitcoinleveldb-log", version = "0.1.19" }
bitcoinleveldb-logreader = { path = "../bitcoinleveldb-logreader", version = "0.1.1" }
bitcoinleveldb-iteratorinner = { path = "../bitcoinleveldb-iteratorinner", version = "0.1.0" }
bitcoinleveldb-versionsetinterface = { path = "../bitcoinleveldb-versionsetinterface", version = "0.1.0" }
bitcoinleveldb-cfg = { path = "../bitcoinleveldb-cfg", version = "0.1.19" }
bitcoinleveldb-merger = { path = "../bitcoinleveldb-merger", version = "0.1.19" }
bitcoinleveldb-tablebuilder = { path = "../bitcoinleveldb-tablebuilder", version = "0.1.0" }
bitcoinleveldb-dbiterstate = { path = "../bitcoinleveldb-dbiterstate", version = "0.1.0" }
bitcoinleveldb-filter = { path = "../bitcoinleveldb-filter", version = "0.1.19" }
