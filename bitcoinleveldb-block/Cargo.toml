[package]
name = "bitcoinleveldb-block"
version = "0.1.0"
license = "MIT AND BSD-3-Clause"
edition = "2024"
description = "Read-only LevelDB table data blocks and their iterators."

# keywords = []
# categories = []

repository = "https://github.com/klebs6/bitcoin-rs"
[dependencies]
tracing.workspace = true
bitcoinleveldb-coding = { path = "../bitcoinleveldb-coding", version = "0.1.19" }
bitcoinleveldb-iterator = { path = "../bitcoinleveldb-iterator", version = "0.1.0" }
bitcoinleveldb-blockiter = { path = "../bitcoinleveldb-blockiter", version = "0.1.0" }
bitcoinleveldb-emptyiterator = { path = "../bitcoinleveldb-emptyiterator", version = "0.1.0" }
bitcoinleveldb-erroriterator = { path = "../bitcoinleveldb-erroriterator", version = "0.1.0" }
bitcoinleveldb-blockcontents = { path = "../bitcoinleveldb-blockcontents", version = "0.1.0" }
bitcoinleveldb-iteratorinner = { path = "../bitcoinleveldb-iteratorinner", version = "0.1.0" }

[build-dependencies.bitcoin-cfg]
path = "../bitcoin-cfg"
version = "0.1.19"

[dependencies.bitcoin-derive]
path = "../bitcoin-derive"
version = "0.1.19"

[dependencies.bitcoin-imports]
path = "../bitcoin-imports"
version = "0.1.19"

[dependencies.bitcoinleveldb-cache]
path = "../bitcoinleveldb-cache"
version = "0.1.19"

[dependencies.bitcoinleveldb-comparator]
path = "../bitcoinleveldb-comparator"
version = "0.1.19"

[dependencies.bitcoinleveldb-env]
path = "../bitcoinleveldb-env"
version = "0.1.19"

[dependencies.bitcoinleveldb-file]
path = "../bitcoinleveldb-file"
version = "0.1.19"

[dependencies.bitcoinleveldb-filter]
path = "../bitcoinleveldb-filter"
version = "0.1.19"

[dependencies.bitcoinleveldb-key]
path = "../bitcoinleveldb-key"
version = "0.1.19"

[dependencies.bitcoinleveldb-options]
path = "../bitcoinleveldb-options"
version = "0.1.19"

[dependencies.bitcoinleveldb-rand]
path = "../bitcoinleveldb-rand"
version = "0.1.19"

[dependencies.bitcoinleveldb-slice]
path = "../bitcoinleveldb-slice"
version = "0.1.19"

[dependencies.bitcoinleveldb-status]
path = "../bitcoinleveldb-status"
version = "0.1.19"

[dependencies.bitcoinleveldb-util]
path = "../bitcoinleveldb-util"
version = "0.1.19"


