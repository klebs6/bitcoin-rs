[package]
name = "bitcoinleveldb-tableconstructor"
version = "0.1.0"
license = "MIT"
edition = "2024"
description = "An in-memory table-construction fixture for LevelDB iterator tests."

# keywords = []
# categories = []

repository = "https://github.com/klebs6/bitcoin-rs"
[build-dependencies.bitcoin-cfg]
path = "../bitcoin-cfg"
version = "0.1.19"

[dependencies]
tracing.workspace = true
bitcoinleveldb-tablebuilder = { path = "../bitcoinleveldb-tablebuilder", version = "0.1.0" }
bitcoinleveldb-stringsource = { path = "../bitcoinleveldb-stringsource", version = "0.1.0" }
bitcoinleveldb-options = { path = "../bitcoinleveldb-options", version = "0.1.19" }
bitcoinleveldb-blockconstructor = { path = "../bitcoinleveldb-blockconstructor", version = "0.1.0" }
bitcoinleveldb-file = { path = "../bitcoinleveldb-file", version = "0.1.19" }
bitcoinleveldb-slice = { path = "../bitcoinleveldb-slice", version = "0.1.19" }
bitcoinleveldb-status = { path = "../bitcoinleveldb-status", version = "0.1.19" }
bitcoinleveldb-table = { path = "../bitcoinleveldb-table", version = "0.1.19" }
bitcoinleveldb-comparator = { path = "../bitcoinleveldb-comparator", version = "0.1.19" }
bitcoinleveldb-iterator = { path = "../bitcoinleveldb-iterator", version = "0.1.0" }
bitcoinleveldb-stringsink = { path = "../bitcoinleveldb-stringsink", version = "0.1.0" }
bitcoinleveldb-footer = { path = "../bitcoinleveldb-footer", version = "0.1.0" }

[dependencies.bitcoin-derive]
path = "../bitcoin-derive"
version = "0.1.19"

[dependencies.bitcoin-imports]
path = "../bitcoin-imports"
version = "0.1.19"


