[package]
name = "bitcoinleveldb-tablecache"
version = "0.1.0"
license = "MIT AND BSD-3-Clause"
edition = "2024"
description = "Cache of opened LevelDB table files and their readers."

# keywords = []
# categories = []

repository = "https://github.com/klebs6/bitcoin-rs"
[build-dependencies.bitcoin-cfg]
path = "../bitcoin-cfg"
version = "0.1.19"

[dependencies]
tracing.workspace = true
bitcoinleveldb-slice = { path = "../bitcoinleveldb-slice", version = "0.1.19" }
bitcoinleveldb-options = { path = "../bitcoinleveldb-options", version = "0.1.19" }
bitcoinleveldb-table = { path = "../bitcoinleveldb-table", version = "0.1.19" }
bitcoinleveldb-file = { path = "../bitcoinleveldb-file", version = "0.1.19" }
bitcoinleveldb-cache = { path = "../bitcoinleveldb-cache", version = "0.1.19" }
bitcoinleveldb-status = { path = "../bitcoinleveldb-status", version = "0.1.19" }
bitcoinleveldb-env = { path = "../bitcoinleveldb-env", version = "0.1.19" }
bitcoinleveldb-iterator = { path = "../bitcoinleveldb-iterator", version = "0.1.0" }
bitcoinleveldb-lru = { path = "../bitcoinleveldb-lru", version = "0.1.19" }
bitcoinleveldb-iteratorinner = { path = "../bitcoinleveldb-iteratorinner", version = "0.1.0" }
bitcoinleveldb-tablebuilder = { path = "../bitcoinleveldb-tablebuilder", version = "0.1.0" }
bitcoinleveldb-erroriterator = { path = "../bitcoinleveldb-erroriterator", version = "0.1.0" }
bitcoinleveldb-log = { path = "../bitcoinleveldb-log", version = "0.1.19" }

[dependencies.bitcoin-derive]
path = "../bitcoin-derive"
version = "0.1.19"

[dependencies.bitcoin-imports]
path = "../bitcoin-imports"
version = "0.1.19"


