[package]
name = "bitcoinleveldb-erroriterator"
version = "0.1.0"
license = "MIT"
edition = "2024"
description = "Constructs an empty iterator carrying a supplied Status, for paths where a table or other iterator source could not be opened."

# keywords = []
# categories = []

repository = "https://github.com/klebs6/bitcoin-rs"
[dependencies]
tracing.workspace = true
bitcoinleveldb-iterator = { path = "../bitcoinleveldb-iterator", version = "0.1.0" }
bitcoinleveldb-status = { path = "../bitcoinleveldb-status", version = "0.1.19" }
bitcoinleveldb-emptyiterator = { path = "../bitcoinleveldb-emptyiterator", version = "0.1.0" }
bitcoinleveldb-slice = { path = "../bitcoinleveldb-slice", version = "0.1.19" }
bitcoinleveldb-iteratorinner = { path = "../bitcoinleveldb-iteratorinner", version = "0.1.0" }

[build-dependencies.bitcoin-cfg]
path = "../bitcoin-cfg"
version = "0.1.19"

[dependencies.bitcoin-derive]
path = "../bitcoin-derive"
version = "0.1.19"

[dependencies.bitcoin-imports]
path = "../bitcoin-imports"
version = "0.1.19"


