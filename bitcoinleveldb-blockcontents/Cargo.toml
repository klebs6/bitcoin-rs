[package]
name = "bitcoinleveldb-blockcontents"
version = "0.1.0"
license = "MIT"
edition = "2024"
description = "The byte view and ownership metadata passed between LevelDB block readers and block objects."

# keywords = []
# categories = []

repository = "https://github.com/klebs6/bitcoin-rs"
[dependencies]
tracing.workspace = true
derive_builder.workspace = true
bitcoinleveldb-slice = { path = "../bitcoinleveldb-slice", version = "0.1.19" }

[build-dependencies.bitcoin-cfg]
path = "../bitcoin-cfg"
version = "0.1.19"

[dependencies.bitcoin-derive]
path = "../bitcoin-derive"
version = "0.1.19"

[dependencies.bitcoin-imports]
path = "../bitcoin-imports"
version = "0.1.19"
