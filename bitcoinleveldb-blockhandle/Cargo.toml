[package]
name = "bitcoinleveldb-blockhandle"
version = "0.1.0"
license = "MIT"
edition = "2024"
description = "Block locations and block-reading helpers for LevelDB SSTable files. BlockHandle records an offset and payload size, encodes them as varints, and decodes them with a Status result. BLOCK_TRAILER_SIZE describes the trailing compression-type byte and checksum."

# keywords = []
# categories = []

repository = "https://github.com/klebs6/bitcoin-rs"
[dependencies]
tracing.workspace = true
bitcoinleveldb-coding = { path = "../bitcoinleveldb-coding", version = "0.1.19" }
bitcoinleveldb-iterator = { path = "../bitcoinleveldb-iterator", version = "0.1.0" }
bitcoinleveldb-blockcontents = { path = "../bitcoinleveldb-blockcontents", version = "0.1.0" }
