[package]
name = "bitcoinleveldb-snapshot"
version = "0.1.0"
license = "MIT AND BSD-3-Clause"
edition = "2024"
description = "Snapshot handles and the internal sequence-number snapshot list for LevelDB."

# keywords = []
# categories = []

repository = "https://github.com/klebs6/bitcoin-rs"
[build-dependencies.bitcoin-cfg]
path = "../bitcoin-cfg"
version = "0.1.19"

[dependencies]
tracing.workspace = true
getset.workspace = true
derive_builder.workspace = true
bitcoin-imports = { path = "../bitcoin-imports", version = "0.1.19" }
bitcoinleveldb-key = { path = "../bitcoinleveldb-key", version = "0.1.19" }
bitcoinleveldb-status = { path = "../bitcoinleveldb-status", version = "0.1.19" }
bitcoinleveldb-logwriter = { path = "../bitcoinleveldb-logwriter", version = "0.1.1" }
